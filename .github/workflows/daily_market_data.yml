name: Daily Market Data Placeholder

on:
  workflow_dispatch:
  schedule:
    # Placeholder: 21:30 UTC ~= 18:30 Argentina (UTC-3)
    - cron: '30 21 * * 1-5'

jobs:
  daily-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
