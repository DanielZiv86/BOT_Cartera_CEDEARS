name: Audit G4-2.2 Shadow Stress Budget

on:
  workflow_dispatch:
    inputs:
      g4_v21_run_id:
        description: Exact successful certified G4-2.1 run id
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit-g4-v22-shadow:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: pytest -q tests/test_g4_v22_shadow.py tests/test_g4_cash_hurdle.py tests/test_deep_scenario_v23.py
      - name: Download exact certified G4-2.1 artifact
        run: |
          R="${{ inputs.g4_v21_run_id }}"; M=$(gh run view "$R" --json workflowName,conclusion,headBranch)
          test "$(echo "$M"|python -c 'import json,sys;print(json.load(sys.stdin)["workflowName"])')" = "Build Valuation G4 Cash Hurdle"
          test "$(echo "$M"|python -c 'import json,sys;print(json.load(sys.stdin)["conclusion"])')" = "success"
          mkdir -p data/upstream_g4; gh run download "$R" --name valuation-g4-cash-hurdle --dir data/upstream_g4
          python - <<'PY'
          import json
          m=json.load(open('data/upstream_g4/g4_manifest.json'));l=json.load(open('data/upstream_g4/e2e_lineage.json'))
          assert m['methodology_version']=='G4-2.1';assert m['scenario_methodology_version']=='SCENARIO-2.3';assert m['preservation_gate_scenario']=='STRESS';assert l['g4_run_id']==int('${{ inputs.g4_v21_run_id }}')
          PY
      - name: Build G4-2.2 shadow comparison
        run: |
          mkdir -p data/canonical/g4_v22_shadow
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd,yaml
          from src.valuation.g4_v22_shadow import build_g4_v22_shadow
          src=Path('data/upstream_g4'); candidates=['g4_cash_hurdle.parquet','g4_results.parquet','g4_candidates.parquet']; p=next((src/x for x in candidates if (src/x).exists()),None)
          if p is None:
            ps=list(src.glob('*.parquet')); assert len(ps)==1,('G4_PARQUET_NOT_UNIQUE',ps);p=ps[0]
          df=pd.read_parquet(p);policy=yaml.safe_load(open('config/g4_policy_v22_shadow.yml'));out,metrics=build_g4_v22_shadow(df,policy)
          outdir=Path('data/canonical/g4_v22_shadow');out.to_parquet(outdir/'g4_v22_shadow_comparison.parquet',index=False);out.to_csv(outdir/'g4_v22_shadow_comparison.csv',index=False)
          metrics['source_g4_v21_run_id']=int('${{ inputs.g4_v21_run_id }}');metrics['source_g4_v21_artifact']=p.name
          (outdir/'g4_v22_shadow_manifest.json').write_text(json.dumps(metrics,indent=2))
          print(json.dumps(metrics,indent=2))
          print(out[['cedear_ticker','g4_v21_status','g4_v22_shadow_status','stress_return_net','position_stress_contribution_nav','stress_compatible_max_weight','risk_adjusted_er','net_benefit_vs_cash']].to_string(index=False))
          PY
      - name: Certify no production authority
        run: |
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open('data/canonical/g4_v22_shadow/g4_v22_shadow_manifest.json'));df=pd.read_parquet('data/canonical/g4_v22_shadow/g4_v22_shadow_comparison.parquet')
          assert m['methodology_version']=='G4-2.2-SHADOW' and m['shadow_only'] is True and m['production_decision_authority'] is False and m['production_chain_unchanged'] is True
          assert m['scenario_methodology_version']=='SCENARIO-2.3' and m['compare_against']=='G4-2.1';assert len(df)==m['ticker_count'];assert df['g4_v22_shadow_only'].all()
          print('G4_2_2_SHADOW_AUDIT_CONTRACT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g4-v22-shadow-audit
          path: data/canonical/g4_v22_shadow/
          if-no-files-found: error
          retention-days: 90

# Deliberately no dispatch to Risk or Committee. G4-2.2 remains shadow-only.
