name: Build Canonical Valuation Scenarios

on:
  workflow_dispatch:
    inputs:
      dispatch_g4:
        description: "Dispatch G4 after certified Scenario V2.3 Valuation"
        required: false
        default: false
        type: boolean

concurrency:
  group: valuation-scenarios-main
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  build-valuation-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
      E2E_RUN_ID: E2E-MANUAL-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Run valuation and Scenario V2.3 regression tests
        run: pytest -q tests/test_valuation_engines.py tests/test_valuation_v17.py tests/test_finnhub_symbol_normalization.py tests/test_vanguard_holdings_parser.py tests/test_deep_scenario_engine.py tests/test_deep_scenario_v23.py
      - name: Resolve Research first and consume its exact pinned Universe
        run: |
          R=$(gh run list --workflow weekly_screening.yml --branch "${GITHUB_REF_NAME}" --status success --limit 1 --json databaseId --jq '.[0].databaseId'); test -n "$R" && test "$R" != null
          mkdir -p data/upstream_research data/upstream_universe data/upstream_prices
          gh run download "$R" --name research-mvp-screening --dir data/upstream_research
          test -f data/upstream_research/research_lineage.json
          U=$(python -c "import json; print(json.load(open('data/upstream_research/research_lineage.json'))['universe_run_id'])")
          Q=$(gh run list --workflow underlying_prices.yml --branch "${GITHUB_REF_NAME}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          L=$(gh run list --workflow cedear_local_market.yml --branch "${GITHUB_REF_NAME}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          P=$(gh run list --workflow portfolio_state.yml --branch "${GITHUB_REF_NAME}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          for X in "$U" "$Q" "$L" "$P"; do test -n "$X" && test "$X" != null; done
          echo "RESEARCH_RUN_ID=$R" >> "$GITHUB_ENV"; echo "UNIVERSE_RUN_ID=$U" >> "$GITHUB_ENV"; echo "LOCAL_RUN_ID=$L" >> "$GITHUB_ENV"; echo "PORTFOLIO_RUN_ID=$P" >> "$GITHUB_ENV"; echo "PRICE_RUN_ID=$Q" >> "$GITHUB_ENV"
          gh run download "$U" --name canonical-universe --dir data/upstream_universe
          gh run download "$Q" --name underlying-price-layer --dir data/upstream_prices
      - name: Certify Research and immutable deployment-qualified Top-N
        run: |
          python - <<'PY'
          import json,os,pandas as pd
          integ=json.load(open('data/upstream_research/research_integrity.json')); rl=json.load(open('data/upstream_research/research_lineage.json'))
          assert integ['status']=='PASS' and float(integ['coverage_pct'])==100
          assert rl.get('handoff')=='CERTIFIED_UNIVERSE_TO_RESEARCH_EXACT_RUN' and int(rl['research_run_id'])==int(os.environ['RESEARCH_RUN_ID']) and int(rl['universe_run_id'])==int(os.environ['UNIVERSE_RUN_ID'])
          r=pd.read_parquet('data/upstream_research/research_screening.parquet');u=pd.read_parquet('data/upstream_universe/cedear_universe_master.parquet');um=json.load(open('data/upstream_universe/universe_manifest.json'));expected=int(um['canonical_eligible_count'])
          assert expected>0 and len(r)==expected and len(u)==expected and int(rl['canonical_eligible_universe_count'])==expected
          selected=r.loc[r['selected'].fillna(False).astype(bool)].sort_values('rank').copy();assert len(selected)==30 and selected['top_n_eligibility'].fillna(False).astype(bool).all();tickers=selected.cedear_ticker.astype(str).str.upper().tolist();assert len(set(tickers))==30
          out=u[u.cedear_ticker.astype(str).str.upper().isin(set(tickers))].copy();assert len(out)==30;out.to_parquet('data/upstream_universe/research_topn_universe.parquet',index=False)
          json.dump({'e2e_run_id':os.environ['E2E_RUN_ID'],'e2e_ref':os.environ['GITHUB_REF_NAME'],'research_run_id':int(os.environ['RESEARCH_RUN_ID']),'universe_run_id':int(os.environ['UNIVERSE_RUN_ID']),'feature_run_id':int(rl['feature_run_id']),'canonical_eligible_universe_count':expected,'top_n':30,'topn_tickers':tickers,'research_universe_handoff':rl['handoff']},open('data/upstream_universe/e2e_lineage.json','w'),indent=2)
          PY
      - name: Build VAL-1.8 screening valuation
        run: |
          python -m src.orchestration.build_valuation_scenarios --universe data/upstream_universe/research_topn_universe.parquet --underlying-prices data/upstream_prices/underlying_prices.parquet --policy config/valuation_policy.yml --etf-sources config/etf_issuer_sources.yml --non-equity-policy config/non_equity_tracker_policy.yml --output-dir data/canonical/valuation
          python - <<'PY'
          import json,os,pandas as pd
          from pathlib import Path
          df=pd.read_parquet('data/canonical/valuation/valuation_scenarios.parquet');l=json.load(open('data/upstream_universe/e2e_lineage.json'));assert len(df)==30
          l.update({'valuation_run_id':int(os.environ['GITHUB_RUN_ID']),'price_run_id':int(os.environ['PRICE_RUN_ID']),'local_market_run_id':int(os.environ['LOCAL_RUN_ID']),'portfolio_run_id':int(os.environ['PORTFOLIO_RUN_ID']),'valuation_count':30,'triggering_workflow':'workflow_dispatch'});Path('data/canonical/valuation/e2e_lineage.json').write_text(json.dumps(l,indent=2))
          PY
      - name: Run mandatory Deep Scenario Review V2.3 on all Top-N
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd,yaml
          from src.valuation.deep_scenario_engine import validate_scenarios
          outdir=Path('data/canonical/valuation');valuation=pd.read_parquet(outdir/'valuation_scenarios.parquet');universe=pd.read_parquet('data/upstream_universe/research_topn_universe.parquet');key='cedear_ticker';missing=[c for c in universe.columns if c!=key and c not in valuation.columns]
          if missing:valuation=valuation.merge(universe[[key]+missing],on=key,how='left',validate='one_to_one')
          policy=yaml.safe_load(Path('config/scenario_review_policy.yml').read_text()) or {};reviewed,review_manifest=validate_scenarios(valuation,policy);assert len(reviewed)==30
          required=['scenario_sector_model','scenario_sector_source','economic_identity_status','scenario_review_status','scenario_review_blockers','scenario_method','identity_adr_ratio_applied','identity_fx_applied','identity_implied_to_market_ratio','stress_target_price','stress_probability','bear_target_price','base_target_price','bull_target_price']
          missing_required=[c for c in required if c not in reviewed.columns];assert not missing_required,missing_required
          validated=reviewed['scenario_validated'].fillna(False).astype(bool);v=reviewed.loc[validated]
          assert ((v['stress_target_price']>0)&(v['stress_target_price']<=v['bear_target_price'])&(v['bear_target_price']<v['base_target_price'])&(v['base_target_price']<v['bull_target_price'])).all()
          assert pd.to_numeric(v['stress_probability'],errors='coerce').abs().le(1e-12).all()
          reviewed.to_parquet(outdir/'deep_scenario_review_v2_1.parquet',index=False);reviewed.to_csv(outdir/'deep_scenario_review_v2_1.csv',index=False)
          def vc(col):return {str(k):int(x) for k,x in reviewed[col].fillna('N/A').astype(str).value_counts().items()}
          blockers={}
          for raw in reviewed['scenario_review_blockers']:
            vals=raw if isinstance(raw,list) else []
            for b in vals: blockers[str(b)]=blockers.get(str(b),0)+1
          audit_cols=[c for c in ['adr_shares_per_depositary_receipt','fundamental_fx_to_market','economic_unit_normalization_verified','eps_unit','target_price_unit','identity_adr_ratio_applied','identity_fx_applied','identity_implied_price','identity_implied_to_market_ratio','identity_target_unit','identity_eps_unit','identity_flags','stress_target_price','stress_probability'] if c in reviewed]
          methodology=review_manifest.get('scenario_methodology_version') or policy.get('methodology_version');manifest={'layer':'Deep Scenario Review V2.3','methodology_version':methodology,'top_n_count':30,'sector_counts':vc('scenario_sector_model'),'sector_source_counts':vc('scenario_sector_source'),'economic_identity_status_counts':vc('economic_identity_status'),'scenario_review_status_counts':vc('scenario_review_status'),'blocker_counts':dict(sorted(blockers.items())),'normalization_audit_columns':audit_cols,'scenario_validated_count':int(review_manifest['scenario_validated_count']),'scenario_blocked_count':int(review_manifest['scenario_blocked_count']),'g4_eligible_count':int(validated.sum()),'stress_separated_from_probabilistic_distribution':True,'fail_closed':True}
          assert methodology=='SCENARIO-2.3';(outdir/'deep_scenario_review_v2_1_manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False));print(json.dumps(manifest,indent=2))
          PY
      - name: Certify Scenario V2.3 artifact contract
        run: |
          python - <<'PY'
          import json,pandas as pd
          df=pd.read_parquet('data/canonical/valuation/deep_scenario_review_v2_1.parquet');m=json.load(open('data/canonical/valuation/deep_scenario_review_v2_1_manifest.json'));assert len(df)==30 and m['top_n_count']==30 and m['fail_closed'] is True and m['methodology_version']=='SCENARIO-2.3' and m['stress_separated_from_probabilistic_distribution'] is True;assert m['scenario_validated_count']+m['scenario_blocked_count']==30
          print('DEEP_SCENARIO_REVIEW_V2_3_AUDIT_CONTRACT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-valuation-scenarios
          path: data/canonical/valuation/
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch exact G4 on same ref
        if: ${{ inputs.dispatch_g4 == true }}
        run: gh workflow run g4_cash_hurdle.yml --ref "${GITHUB_REF_NAME}" -f valuation_run_id="${GITHUB_RUN_ID}"
