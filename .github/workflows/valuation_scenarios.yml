name: Build Canonical Valuation Scenarios

on:
  workflow_dispatch:

concurrency:
  group: valuation-scenarios-main
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  build-valuation-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
      E2E_RUN_ID: E2E-MANUAL-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_valuation_engines.py tests/test_valuation_v17.py tests/test_finnhub_symbol_normalization.py tests/test_vanguard_holdings_parser.py
      - name: Resolve serialized certified upstreams
        run: |
          R=$(gh run list --workflow weekly_screening.yml --status success --limit 1 --json databaseId,headSha --jq '.[0].databaseId'); U=$(gh run list --workflow build_universe.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'); L=$(gh run list --workflow cedear_local_market.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'); P=$(gh run list --workflow portfolio_state.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'); Q=$(gh run list --workflow underlying_prices.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          for X in "$R" "$U" "$L" "$P" "$Q"; do test -n "$X" && test "$X" != null; done
          echo "RESEARCH_RUN_ID=$R" >> "$GITHUB_ENV"; echo "UNIVERSE_RUN_ID=$U" >> "$GITHUB_ENV"; echo "LOCAL_RUN_ID=$L" >> "$GITHUB_ENV"; echo "PORTFOLIO_RUN_ID=$P" >> "$GITHUB_ENV"; echo "PRICE_RUN_ID=$Q" >> "$GITHUB_ENV"
          mkdir -p data/upstream_research data/upstream_universe data/upstream_prices
          gh run download "$R" --name research-mvp-screening --dir data/upstream_research
          gh run download "$U" --name canonical-universe --dir data/upstream_universe
          gh run download "$Q" --name underlying-price-layer --dir data/upstream_prices
      - name: Certify Research and immutable deployment-qualified Top-N
        run: |
          python - <<'PY'
          import json,os,pandas as pd
          integ=json.load(open('data/upstream_research/research_integrity.json')); assert integ['status']=='PASS' and float(integ['coverage_pct'])==100
          r=pd.read_parquet('data/upstream_research/research_screening.parquet'); u=pd.read_parquet('data/upstream_universe/cedear_universe_master.parquet'); um=json.load(open('data/upstream_universe/universe_manifest.json')); expected=int(um['canonical_eligible_count']); assert expected==304 and len(r)==expected and len(u)==expected
          # Research ranks all 304 names, including mandate exceptions such as IWDA.
          # Downstream Valuation/G4 must consume the explicit deployment-qualified
          # selection, not blindly the first 30 universal ranks.
          assert 'selected' in r.columns and 'top_n_eligibility' in r.columns
          selected=r.loc[r['selected'].fillna(False).astype(bool)].sort_values('rank').copy()
          assert len(selected)==30, {'selected_count':len(selected)}
          assert selected['top_n_eligibility'].fillna(False).astype(bool).all()
          top=selected
          tickers=top.cedear_ticker.astype(str).str.upper().tolist()
          assert len(set(tickers))==30
          out=u[u.cedear_ticker.astype(str).str.upper().isin(set(tickers))].copy(); assert len(out)==30
          out.to_parquet('data/upstream_universe/research_topn_universe.parquet',index=False)
          json.dump({'e2e_run_id':os.environ['E2E_RUN_ID'],'research_run_id':int(os.environ['RESEARCH_RUN_ID']),'universe_run_id':int(os.environ['UNIVERSE_RUN_ID']),'canonical_eligible_universe_count':expected,'top_n':30,'topn_tickers':tickers},open('data/upstream_universe/e2e_lineage.json','w'),indent=2)
          PY
      - name: Build Deep Research valuation
        run: |
          python -m src.orchestration.build_valuation_scenarios --universe data/upstream_universe/research_topn_universe.parquet --underlying-prices data/upstream_prices/underlying_prices.parquet --policy config/valuation_policy.yml --etf-sources config/etf_issuer_sources.yml --non-equity-policy config/non_equity_tracker_policy.yml --output-dir data/canonical/valuation
          python - <<'PY'
          import json,os,pandas as pd
          from pathlib import Path
          df=pd.read_parquet('data/canonical/valuation/valuation_scenarios.parquet'); l=json.load(open('data/upstream_universe/e2e_lineage.json')); assert len(df)==30
          l.update({'valuation_run_id':int(os.environ['GITHUB_RUN_ID']),'price_run_id':int(os.environ['PRICE_RUN_ID']),'local_market_run_id':int(os.environ['LOCAL_RUN_ID']),'portfolio_run_id':int(os.environ['PORTFOLIO_RUN_ID']),'valuation_count':30,'triggering_workflow':'workflow_dispatch'}); Path('data/canonical/valuation/e2e_lineage.json').write_text(json.dumps(l,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-valuation-scenarios
          path: data/canonical/valuation/
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch exact G4
        run: gh workflow run g4_cash_hurdle.yml --ref "${GITHUB_REF_NAME}" -f valuation_run_id="${GITHUB_RUN_ID}"
