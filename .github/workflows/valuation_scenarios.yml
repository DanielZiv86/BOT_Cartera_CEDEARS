name: Build Canonical Valuation Scenarios

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Research MVP Screening"]
    types: [completed]

concurrency:
  group: valuation-scenarios-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-valuation-scenarios:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
      E2E_RUN_ID: ${{ github.event_name == 'workflow_run' && format('E2E-RESEARCH-{0}', github.event.workflow_run.id) || format('E2E-MANUAL-{0}', github.run_id) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run valuation unit tests
        run: pytest -q tests/test_valuation_engines.py tests/test_valuation_v17.py tests/test_finnhub_symbol_normalization.py tests/test_vanguard_holdings_parser.py

      - name: Resolve and download certified Research upstream
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RESEARCH_RUN_ID="${{ github.event.workflow_run.id }}"
            RESEARCH_COMMIT="${{ github.event.workflow_run.head_sha }}"
          else
            RESEARCH_META=$(gh run list --workflow weekly_screening.yml --status success --limit 1 --json databaseId,headSha --jq '.[0]')
            RESEARCH_RUN_ID=$(echo "$RESEARCH_META" | python -c 'import json,sys; print(json.load(sys.stdin)["databaseId"])')
            RESEARCH_COMMIT=$(echo "$RESEARCH_META" | python -c 'import json,sys; print(json.load(sys.stdin)["headSha"])')
          fi
          test -n "$RESEARCH_RUN_ID" && test "$RESEARCH_RUN_ID" != "null"
          test -n "$RESEARCH_COMMIT" && test "$RESEARCH_COMMIT" != "null"
          echo "RESEARCH_RUN_ID=$RESEARCH_RUN_ID" >> "$GITHUB_ENV"
          echo "RESEARCH_COMMIT=$RESEARCH_COMMIT" >> "$GITHUB_ENV"
          mkdir -p data/upstream_research
          gh run download "$RESEARCH_RUN_ID" --name research-mvp-screening --dir data/upstream_research
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/upstream_research/research_integrity.json')
          assert p.exists(), 'missing research_integrity.json'
          d=json.loads(p.read_text())
          assert d.get('status') == 'PASS', d
          assert float(d.get('coverage_pct',0)) == 100.0, d
          PY

      - name: Download canonical universe and build immutable Top-N universe
        run: |
          RUN_ID=$(gh run list --workflow build_universe.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          mkdir -p data/upstream_universe
          gh run download "$RUN_ID" --name canonical-universe --dir data/upstream_universe
          python - <<'PY'
          import json, os, pandas as pd
          r=pd.read_parquet('data/upstream_research/research_screening.parquet')
          u=pd.read_parquet('data/upstream_universe/cedear_universe_master.parquet')
          assert len(r)==305 and r['rank'].notna().all()
          top=r.sort_values('rank').head(30)
          tickers=set(top['cedear_ticker'].astype(str).str.upper())
          out=u[u['cedear_ticker'].astype(str).str.upper().isin(tickers)].copy()
          assert len(out)==30, (len(out), tickers-set(out['cedear_ticker'].astype(str).str.upper()))
          out.to_parquet('data/upstream_universe/research_topn_universe.parquet', index=False)
          manifest={'e2e_run_id':os.environ['E2E_RUN_ID'],'research_run_id':int(os.environ['RESEARCH_RUN_ID']),'research_commit':os.environ['RESEARCH_COMMIT'],'top_n':30,'topn_tickers':top['cedear_ticker'].astype(str).tolist()}
          assert manifest['research_commit'], 'research_commit must be populated'
          open('data/upstream_universe/e2e_lineage.json','w').write(json.dumps(manifest,indent=2))
          PY

      - name: Download latest underlying prices
        run: |
          RUN_ID=$(gh run list --workflow underlying_prices.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          echo "PRICE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          mkdir -p data/upstream_prices
          gh run download "$RUN_ID" --name underlying-price-layer --dir data/upstream_prices
          test -f data/upstream_prices/underlying_prices.parquet

      - name: Build Deep Research valuation only for Research Top-N
        run: |
          python -m src.orchestration.build_valuation_scenarios \
            --universe data/upstream_universe/research_topn_universe.parquet \
            --underlying-prices data/upstream_prices/underlying_prices.parquet \
            --policy config/valuation_policy.yml \
            --etf-sources config/etf_issuer_sources.yml \
            --non-equity-policy config/non_equity_tracker_policy.yml \
            --output-dir data/canonical/valuation
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          p='data/canonical/valuation/valuation_scenarios.parquet'
          df=pd.read_parquet(p)
          assert len(df)==30, f'valuation must preserve Research Top-30, got {len(df)}'
          lineage=json.loads(Path('data/upstream_universe/e2e_lineage.json').read_text())
          assert lineage.get('research_commit'), 'missing research commit lineage'
          lineage['valuation_run_id']=int('${{ github.run_id }}')
          lineage['price_run_id']=int('${{ env.PRICE_RUN_ID }}')
          lineage['valuation_count']=len(df)
          Path('data/canonical/valuation/e2e_lineage.json').write_text(json.dumps(lineage,indent=2))
          PY

      - name: Upload valuation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-valuation-scenarios
          path: |
            data/canonical/valuation/valuation_scenarios.json
            data/canonical/valuation/valuation_scenarios.parquet
            data/canonical/valuation/valuation_scenarios_metrics.json
            data/canonical/valuation/e2e_lineage.json
          if-no-files-found: error
          retention-days: 90
