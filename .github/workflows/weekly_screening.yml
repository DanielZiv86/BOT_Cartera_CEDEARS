name: Build Research MVP Screening

on:
  workflow_dispatch:
  push:
    paths:
      - "src/research/**"
      - "src/orchestration/build_research_screening.py"
      - "tests/test_research_screening.py"
      - ".github/workflows/weekly_screening.yml"

permissions:
  contents: read
  actions: read

jobs:
  weekly-screening:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_research_screening.py
      - name: Download serialized upstreams
        run: |
          U=$(gh run list --workflow build_universe.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'); test -n "$U"
          F=$(gh run list --workflow market_features.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'); test -n "$F"
          mkdir -p data/upstream_universe data/upstream_features
          gh run download "$U" --name canonical-universe --dir data/upstream_universe
          gh run download "$F" --name market-feature-engine --dir data/upstream_features
      - name: Build and certify Research MVP v1.0
        run: |
          EXPECTED=$(python -c "import json; print(json.load(open('data/upstream_universe/universe_manifest.json'))['canonical_eligible_count'])")
          python -m src.orchestration.build_research_screening --universe data/upstream_universe/cedear_universe_master.parquet --features data/upstream_features/market_features.parquet --top-n 30 --expected-count "$EXPECTED" --min-top-data-quality 60 --output-dir data/canonical/research
      - uses: actions/upload-artifact@v4
        with:
          name: research-mvp-screening
          path: data/canonical/research/
          if-no-files-found: error
          retention-days: 90
