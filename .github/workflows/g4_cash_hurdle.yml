name: Build Valuation G4 Cash Hurdle

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Canonical Valuation Scenarios"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  build-g4:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run G4 unit tests
        run: pytest -q tests/test_g4_cash_hurdle.py

      - name: Download exact triggering valuation artifact
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            VAL_RUN_ID="${{ github.event.workflow_run.id }}"
          else
            VAL_RUN_ID=$(gh run list --workflow valuation_scenarios.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$VAL_RUN_ID" && test "$VAL_RUN_ID" != "null"
          echo "VAL_RUN_ID=$VAL_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p data/upstream_valuation
          gh run download "$VAL_RUN_ID" --name canonical-valuation-scenarios --dir data/upstream_valuation
          test -f data/upstream_valuation/valuation_scenarios.parquet
          test -f data/upstream_valuation/e2e_lineage.json
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open('data/upstream_valuation/e2e_lineage.json'))
          v=pd.read_parquet('data/upstream_valuation/valuation_scenarios.parquet')
          top={str(x).upper() for x in d.get('topn_tickers',[])}
          assert d.get('research_run_id'), d
          assert d.get('top_n') == 30 and len(top) == 30, d
          assert d.get('valuation_count') == 30 and len(v) == 30, d
          assert set(v['cedear_ticker'].astype(str).str.upper()) == top
          assert d.get('local_market_run_id'), 'valuation lineage must pin local_market_run_id'
          assert d.get('portfolio_run_id'), 'valuation lineage must pin portfolio_run_id'
          PY

      - name: Download lineage-pinned CEDEAR local market layer
        run: |
          RUN_ID=$(python -c "import json; print(json.load(open('data/upstream_valuation/e2e_lineage.json'))['local_market_run_id'])")
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          echo "LOCAL_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          mkdir -p data/upstream_local
          gh run download "$RUN_ID" --name cedear-local-market-layer --dir data/upstream_local
          test -f data/upstream_local/cedear_local_market.parquet

      - name: Download lineage-pinned portfolio state layer
        run: |
          RUN_ID=$(python -c "import json; print(json.load(open('data/upstream_valuation/e2e_lineage.json'))['portfolio_run_id'])")
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          echo "PORTFOLIO_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          mkdir -p data/upstream_portfolio
          gh run download "$RUN_ID" --name portfolio-state-engine --dir data/upstream_portfolio
          test -f data/upstream_portfolio/portfolio_fit_quantitative.parquet
          test -f data/upstream_portfolio/portfolio_positions.parquet

      - name: Restrict G4 candidate layers to immutable Research Top-30
        run: |
          python - <<'PY'
          import json, pandas as pd
          d=json.load(open('data/upstream_valuation/e2e_lineage.json'))
          top={str(x).upper() for x in d['topn_tickers']}
          assert len(top)==30

          aliases={
              'BA.C':'BA',
              'BBV':'BBVA',
              'TRVV':'TRV',
          }

          def normalize_symbol(x):
              s=str(x).upper().strip()
              return aliases.get(s,s)

          for path in ['data/upstream_local/cedear_local_market.parquet','data/upstream_portfolio/portfolio_fit_quantitative.parquet']:
              df=pd.read_parquet(path)
              col='cedear_ticker' if 'cedear_ticker' in df.columns else 'ticker'
              raw=df[col].astype(str).str.upper().str.strip()
              norm=raw.map(normalize_symbol)
              top_norm={normalize_symbol(x) for x in top}
              mask=norm.isin(top_norm)
              out=df[mask].copy()
              out[col]=norm[mask].values
              missing=top_norm-set(out[col].astype(str).str.upper())
              assert not missing, f'{path} missing Top-N identities after normalization: {sorted(missing)}'
              assert len(out)==30, (path,len(out))
              out.to_parquet(path,index=False)
          PY

      - name: Build G4 Cash Hurdle from same Research lineage
        run: |
          python -m src.orchestration.build_g4_cash_hurdle \
            --local-market data/upstream_local/cedear_local_market.parquet \
            --valuation-inputs data/upstream_valuation/valuation_scenarios.parquet \
            --portfolio-fit data/upstream_portfolio/portfolio_fit_quantitative.parquet \
            --positions data/upstream_portfolio/portfolio_positions.parquet \
            --policy config/g4_policy.yml --output-dir data/canonical/g4 --brokerage-rate 0.006
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('data/upstream_valuation/e2e_lineage.json'))
          manifest=json.load(open('data/canonical/g4/g4_manifest.json'))
          assert manifest.get('ticker_count') == 30, manifest
          assert manifest.get('evaluated_count',0)+manifest.get('blocked_count',0) == 30, manifest
          d.update({'g4_run_id':int('${{ github.run_id }}'),'valuation_run_id':int('${{ env.VAL_RUN_ID }}'),'local_market_run_id':int('${{ env.LOCAL_RUN_ID }}'),'portfolio_run_id':int('${{ env.PORTFOLIO_RUN_ID }}'),'g4_candidate_count':30})
          Path('data/canonical/g4/e2e_lineage.json').write_text(json.dumps(d,indent=2))
          PY

      - name: Upload G4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valuation-g4-cash-hurdle
          path: |
            data/canonical/g4/g4_cash_hurdle.json
            data/canonical/g4/g4_cash_hurdle.parquet
            data/canonical/g4/g4_ranked_evaluated.json
            data/canonical/g4/g4_ranked_actionable.json
            data/canonical/g4/g4_manifest.json
            data/canonical/g4/e2e_lineage.json
          if-no-files-found: error
          retention-days: 90
