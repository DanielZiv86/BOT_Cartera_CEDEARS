name: Build Investment Committee Decision

on:
  workflow_dispatch:
    inputs:
      risk_run_id: {required: true, type: string}
      g4_run_id: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  committee:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Download exact Risk and G4 artifacts and certify V2.3 lineage
        run: |
          R="${{ inputs.risk_run_id }}"; G="${{ inputs.g4_run_id }}"
          RM=$(gh run view "$R" --json workflowName,conclusion,headBranch); GM=$(gh run view "$G" --json workflowName,conclusion,headBranch)
          test "$(echo "$RM"|python -c 'import json,sys;print(json.load(sys.stdin)["workflowName"])')" = "Build Decisional Risk Gate"
          test "$(echo "$RM"|python -c 'import json,sys;print(json.load(sys.stdin)["conclusion"])')" = "success"
          test "$(echo "$RM"|python -c 'import json,sys;print(json.load(sys.stdin)["headBranch"])')" = "${GITHUB_REF_NAME}"
          test "$(echo "$GM"|python -c 'import json,sys;print(json.load(sys.stdin)["workflowName"])')" = "Build Valuation G4 Cash Hurdle"
          test "$(echo "$GM"|python -c 'import json,sys;print(json.load(sys.stdin)["conclusion"])')" = "success"
          test "$(echo "$GM"|python -c 'import json,sys;print(json.load(sys.stdin)["headBranch"])')" = "${GITHUB_REF_NAME}"
          mkdir -p data/upstream_risk data/upstream_g4;gh run download "$R" --name decisional-risk-gate --dir data/upstream_risk;gh run download "$G" --name valuation-g4-cash-hurdle --dir data/upstream_g4
          python - <<'PY'
          import json
          r=json.load(open('data/upstream_risk/e2e_lineage.json'));g=json.load(open('data/upstream_g4/e2e_lineage.json'));m=json.load(open('data/upstream_g4/g4_manifest.json'))
          assert r['decisional_risk_run_id']==int('${{ inputs.risk_run_id }}');assert r['g4_run_id']==int('${{ inputs.g4_run_id }}')==g['g4_run_id']
          for k in ('e2e_run_id','universe_run_id','research_run_id','valuation_run_id','local_market_run_id','portfolio_run_id','g4_run_id'):assert r.get(k)==g.get(k),(k,r,g)
          assert g.get('scenario_methodology_version')=='SCENARIO-2.3';assert g.get('g4_methodology_version')=='G4-2.1';assert g.get('handoff')=='CERTIFIED_V2_3_SCENARIO_EXACT_RUN_DISPATCH'
          assert m.get('scenario_methodology_version')=='SCENARIO-2.3' and m.get('methodology_version')=='G4-2.1'
          assert m.get('preservation_gate_scenario')=='STRESS' and m.get('probabilistic_bear_used_in_expected_return') is True and m.get('stress_probability_weighted') is False
          PY
      - name: Build Committee decision and persist Shadow Book
        run: python -m src.orchestration.build_investment_committee --g4-dir data/upstream_g4 --risk-dir data/upstream_risk --committee-run-id ${{ github.run_id }} --output-dir data/canonical/committee
      - name: Final E2E certification contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('data/canonical/committee/committee_decision.json'));l=json.load(open('data/canonical/committee/e2e_lineage.json'));s=json.load(open('data/canonical/committee/shadow_book.json'));g=json.load(open('data/upstream_g4/g4_manifest.json'));r=json.load(open('data/upstream_risk/decisional_risk.json'));gl=json.load(open('data/upstream_g4/e2e_lineage.json'))
          eligible=int(l.get('canonical_eligible_universe_count',0) or 0);assert eligible>0 and eligible==int(gl.get('canonical_eligible_universe_count',0) or 0);assert int(l.get('top_n',0) or 0)==30 and len(l.get('topn_tickers',[]))==30
          for k in ('universe_run_id','research_run_id','valuation_run_id','local_market_run_id','portfolio_run_id','g4_run_id','decisional_risk_run_id','committee_run_id'):assert int(l.get(k,0))>0,(k,l)
          assert l['g4_run_id']==int('${{ inputs.g4_run_id }}') and l['decisional_risk_run_id']==int('${{ inputs.risk_run_id }}') and l['committee_run_id']==int('${{ github.run_id }}') and l['decision_persisted'] is True
          sr=int(l.get('scenario_review_count',0) or 0);sv=int(l.get('scenario_validated_count',0) or 0);sb=int(l.get('scenario_blocked_count',0) or 0);assert sr==30 and sv+sb==sr
          assert l.get('scenario_methodology_version')=='SCENARIO-2.3';assert l.get('g4_methodology_version')=='G4-2.1';assert l.get('handoff')=='CERTIFIED_V2_3_SCENARIO_EXACT_RUN_DISPATCH'
          assert g.get('methodology_version')=='G4-2.1' and g.get('scenario_methodology_version')=='SCENARIO-2.3';assert g.get('preservation_gate_scenario')=='STRESS';assert g.get('probabilistic_bear_used_in_expected_return') is True;assert g.get('stress_probability_weighted') is False
          ticker=int(g.get('ticker_count',0) or 0);evaluated=int(g.get('evaluated_count',0) or 0);blocked=int(g.get('blocked_count',0) or 0);passes=int(g.get('pass_count',0) or 0);fails=int(g.get('fail_count',0) or 0);assert ticker==30 and evaluated+blocked==ticker and int(g.get('accounted_count',evaluated+blocked))==ticker
          assert r['risk_status']=='PASS' and r['risk_veto']=='NO';assert c['fabricated_trade_count']==0;assert s['e2e_run_id']==l['e2e_run_id'] and s['committee_run_id']==l['committee_run_id'] and s['order_count']==len(s.get('orders',[]))
          if c['decision']=='HOLD_CASH_NO_ACTION':assert s['order_count']==0
          elif c['decision']=='CANDIDATES_REQUIRE_EXECUTION_GATE':assert passes>0 and s['order_count']==0 and c['new_trades']==[]
          else:raise AssertionError(('UNKNOWN_COMMITTEE_DECISION',c))
          print(json.dumps({'FINAL_E2E':'PASS','decision':c['decision'],'rationale':c['rationale'],'canonical_eligible_universe_count':eligible,'scenario_validated_count':sv,'scenario_blocked_count':sb,'scenario_methodology_version':l['scenario_methodology_version'],'g4_methodology_version':l['g4_methodology_version'],'preservation_gate_scenario':g['preservation_gate_scenario'],'lineage':l},indent=2))
          PY
      - name: Upload Committee and final lineage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: investment-committee-decision
          path: |
            data/canonical/committee/committee_decision.json
            data/canonical/committee/shadow_book.json
            data/canonical/committee/e2e_lineage.json
          if-no-files-found: error
