methodology_version: G4-2.1
horizon_months: 12
return_currency: USD_ECONOMIC_RETURN

cash_hurdle:
  cash_return_assumption: 0.00
  minimum_excess_return_over_cash: 0.05
  capital_preservation_buffer: 0.03
  minimum_margin_over_hurdle: 0.02

# Added on top of the base 2% margin for single-name equities. Epistemic
# uncertainty remains separately penalized. Downside is NOT added again here:
# it is already represented in Bull/Base/Bear expected return and enforced by
# the hard Bear preservation gate (see risk.max_bear_downside below). The G4
# sensitivity audit showed that removing the duplicate downside margin does
# not manufacture any PASS.
dynamic_equity_margin:
  base_equity_risk_buffer: 0.015
  uncertainty_buffer_max: 0.020
  downside_buffer_max: 0.000

# max_bear_downside is a per-name tail-risk backstop, not the portfolio's
# real risk control. A -15% floor here was found (via g4_sensitivity_audit.py
# against real data, and by hand against MSFT/NVDA/AMZN) to reject virtually
# every individual equity regardless of quality -- a realistic 12-month Bear
# consensus target for a genuinely strong megacap routinely exceeds -15%,
# so the floor was vetoing normal single-stock volatility, not distressed
# businesses. Loosened to -40% so it only catches names analysts themselves
# see as headed toward serious trouble; the real per-position and
# portfolio-level risk limiting now lives in the allocator's stress budget
# (src/portfolio/allocation.py: position_stress_budget_nav / portfolio_stress_
# budget_nav), which already sizes a worse-bear-case name smaller instead of
# excluding it outright -- consistent with a diversified, dynamically
# rebalanced portfolio rather than a per-name underwriting gate.
risk:
  max_bear_downside: -0.40
  candidate_test_weight_nav: 0.05
  soft_single_name_weight: 0.12
  warning_single_name_weight: 0.15
  max_single_name_weight: 0.20
  correlation_warning: 0.75

penalties:
  uncertainty_penalty_max: 0.10
  local_warning_penalty: 0.02
  correlation_penalty_max: 0.03
  concentration_penalty_max: 0.03

# Explicit conservative policy assumption, not derived from historical CCL/brecha
# data (no such data source is connected yet). Models the risk that capital
# controls tighten or the CCL channel becomes rationed/administratively
# compressed before exit, forcing settlement at a materially worse effective
# conversion rate than today's market CCL. This is a market-wide/currency risk
# factor, applied uniformly to every candidate's Base case.
#
# NOT a PASS/FAIL gate: a CEDEAR holder facing this exact scenario can convert
# into the underlying foreign shares (canje, via custody transfer to a foreign
# broker) and exit in USD abroad instead of being forced to sell locally
# through a degraded CCL. Treating this as an individual hard veto double-
# counted a risk that has a real, if imperfect and not-always-available, hedge.
# The stress return is still computed and reported (fx_stress_return_net) and
# still feeds the allocator's per-position stress budget
# (src/portfolio/allocation.py: worst_case_stress_loss), so currency/
# regulatory risk is managed by sizing, not by excluding a name outright.
fx_regulatory_risk:
  ccl_stress_haircut: 0.25

target_review:
  base_upside_review_threshold: 0.75
  bull_upside_review_threshold: 1.25
  high_low_dispersion_review_threshold: 1.00
  behavior: FLAG_FOR_REVIEW_AFTER_PRE_G4_SCENARIO_VALIDATION

execution:
  brokerage_rate_per_side: 0.006
  analytical_g4_is_separate_from_execution_ready: true

audit_contract:
  sensitivity_bear_limits: [-0.15, -0.25, -0.40, -0.55]
  sensitivity_cash_hurdles: [0.05, 0.08, 0.10]
  sensitivity_uncertainty_scales: [0.0, 0.5, 1.0]
  sensitivity_dynamic_equity_margin: [false, true]
  production_changes_require_economic_evidence: true

policy_notes:
  - G4 consumes only post-review Bull/Base/Bear scenarios; expected return is recomputed after review.
  - Missing material scenario evidence fails closed and cannot receive G4_PASS.
  - Single-name equities require the base margin plus dynamic equity and uncertainty buffers.
  - Downside is represented by scenario-weighted expected return and the hard Bear preservation gate; it is not charged a third time in the dynamic equity margin.
  - Bear_Return_Net must remain above the per-name tail-risk backstop (-40%); real position/portfolio-level downside limiting is the allocator's stress budget, not this gate.
  - A projected single-name weight above 20% is a hard concentration failure.
  - Execution readiness remains separate from analytical attractiveness.
  - Production thresholds are not relaxed merely to create deployment candidates; max_bear_downside moved from -15% to -40% specifically because g4_sensitivity_audit.py against real data showed the old floor rejected essentially every individual equity regardless of quality, and risk limiting was duplicated with (and better served by) the allocator's stress budget.
  - FX/regulatory stress is a market-wide risk factor evaluated once per candidate against a degraded CCL. It is computed and reported (fx_stress_return_net) but is not a PASS/FAIL gate: a CEDEAR holder can hedge this via canje (conversion to the underlying foreign shares, exiting in USD abroad instead of selling locally through a degraded CCL), so it feeds the allocator's stress-budget sizing instead of vetoing a candidate outright.
