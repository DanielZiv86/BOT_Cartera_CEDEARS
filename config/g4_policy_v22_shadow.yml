methodology_version: G4-2.2-SHADOW
horizon_months: 12
return_currency: USD_ECONOMIC_RETURN
shadow_only: true
production_decision_authority: false

cash_hurdle:
  cash_return_assumption: 0.00
  minimum_excess_return_over_cash: 0.05
  capital_preservation_buffer: 0.03
  minimum_margin_over_hurdle: 0.02

dynamic_equity_margin:
  base_equity_risk_buffer: 0.015
  uncertainty_buffer_max: 0.020
  downside_buffer_max: 0.000

risk:
  legacy_max_security_stress_downside: -0.15
  candidate_test_weight_nav: 0.05
  soft_single_name_weight: 0.12
  warning_single_name_weight: 0.15
  max_single_name_weight: 0.20
  correlation_warning: 0.75
  position_stress_budget_nav: 0.02

  # Shadow calibrations only. 100% is a ceiling, never a forced allocation target.
  portfolio_stress_budget_nav: 0.10
  portfolio_stress_budget_mode: AUDIT_ONLY
  portfolio_max_invested_weight: 1.00
  portfolio_max_positions: 10
  portfolio_min_position_weight: 0.02
  portfolio_max_candidate_weight: 0.20
  correlation_lookback_days: 252
  correlation_floor: 0.00
  correlation_missing_behavior: FAIL_CLOSED
  concentration_hhi_warning: 0.15

penalties:
  uncertainty_penalty_max: 0.10
  local_warning_penalty: 0.02
  correlation_penalty_max: 0.03
  concentration_penalty_max: 0.03

target_review:
  base_upside_review_threshold: 0.75
  bull_upside_review_threshold: 1.25
  high_low_dispersion_review_threshold: 1.00
  behavior: FLAG_FOR_REVIEW_AFTER_PRE_G4_SCENARIO_VALIDATION

execution:
  brokerage_rate_per_side: 0.006
  analytical_g4_is_separate_from_execution_ready: true
  shadow_can_dispatch_orders: false
  shadow_can_dispatch_risk: false
  shadow_can_dispatch_committee: false

shadow_audit_contract:
  scenario_methodology_version: SCENARIO-2.3
  compare_against: G4-2.1
  position_stress_budget_sensitivity_nav: [0.005, 0.0075, 0.010, 0.0125, 0.015, 0.020, 0.025, 0.030]
  portfolio_stress_budget_sensitivity_nav: [0.06, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25]
  security_stress_limit_sensitivity: [-0.15, -0.20, -0.25, -0.30, -0.35, -0.40, -0.45, -0.50]
  production_changes_require_economic_evidence: true

policy_notes:
  - Bull/Base/probabilistic Bear remain the only probability-weighted expected-return scenarios.
  - Severe Stress remains probability zero and is used for preservation sizing.
  - Economic eligibility is mandatory before any shadow portfolio weight can be assigned: only SHADOW_PASS candidates may receive weight.
  - 100% NAV is the maximum investable ceiling when enough qualifying opportunities exist; it is not a target that the allocator must fill.
  - Cash is the endogenous residual after economic eligibility and risk sizing, not a strategic 50% floor.
  - Position stress contribution equals proposed portfolio weight times absolute Stress return.
  - Portfolio gross stress is the sum of position stress contributions and is never diversified away.
  - Correlation-aware stress is a diagnostic sqrt(s' C s), using non-negative 252d correlations; it supplements rather than replaces gross stress.
  - Candidate sizing is capped by position Stress budget and the existing 20% single-name maximum.
  - Concentration is reported with HHI and effective-number-of-positions diagnostics.
  - Cash hurdle, minimum margin, transaction costs and existing penalties remain unchanged from G4-2.1 during this audit.
  - USD purchasing-power erosion is a reason to avoid arbitrary cash floors, but does not justify investing in candidates that fail the economic hurdle.
  - G4-2.2 cannot alter production Risk, Committee, Shadow Book or orders during the audit phase.
