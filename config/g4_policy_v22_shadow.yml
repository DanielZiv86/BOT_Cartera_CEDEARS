methodology_version: G4-2.2-SHADOW
horizon_months: 12
return_currency: USD_ECONOMIC_RETURN
shadow_only: true
production_decision_authority: false

# Economics intentionally identical to G4-2.1.
cash_hurdle:
  cash_return_assumption: 0.00
  minimum_excess_return_over_cash: 0.05
  capital_preservation_buffer: 0.03
  minimum_margin_over_hurdle: 0.02

dynamic_equity_margin:
  base_equity_risk_buffer: 0.015
  uncertainty_buffer_max: 0.020
  downside_buffer_max: 0.000

risk:
  # Legacy G4-2.1 threshold is retained only for comparison; it is NOT the
  # G4-2.2 shadow preservation decision rule.
  legacy_max_security_stress_downside: -0.15
  candidate_test_weight_nav: 0.05
  soft_single_name_weight: 0.12
  warning_single_name_weight: 0.15
  max_single_name_weight: 0.20
  correlation_warning: 0.75

  # G4-2.2 shadow preservation architecture.
  # Position stress contribution = proposed_weight * abs(stress_return_net).
  # A 2% NAV loss budget is the initial audited calibration, not production.
  position_stress_budget_nav: 0.02
  # Portfolio aggregate is reported/audited in shadow mode. No production
  # threshold is activated until correlation-aware portfolio stress is certified.
  portfolio_stress_budget_mode: AUDIT_ONLY

penalties:
  uncertainty_penalty_max: 0.10
  local_warning_penalty: 0.02
  correlation_penalty_max: 0.03
  concentration_penalty_max: 0.03

target_review:
  base_upside_review_threshold: 0.75
  bull_upside_review_threshold: 1.25
  high_low_dispersion_review_threshold: 1.00
  behavior: FLAG_FOR_REVIEW_AFTER_PRE_G4_SCENARIO_VALIDATION

execution:
  brokerage_rate_per_side: 0.006
  analytical_g4_is_separate_from_execution_ready: true
  shadow_can_dispatch_orders: false
  shadow_can_dispatch_risk: false
  shadow_can_dispatch_committee: false

shadow_audit_contract:
  scenario_methodology_version: SCENARIO-2.3
  compare_against: G4-2.1
  position_stress_budget_sensitivity_nav: [0.005, 0.0075, 0.010, 0.0125, 0.015, 0.020, 0.025]
  security_stress_limit_sensitivity: [-0.15, -0.20, -0.25, -0.30, -0.35, -0.40, -0.45, -0.50]
  production_changes_require_economic_evidence: true

policy_notes:
  - Bull/Base/probabilistic Bear remain the only probability-weighted expected-return scenarios.
  - Severe Stress remains probability zero and is used for preservation sizing.
  - G4-2.2 replaces the individual -15% Stress veto only in shadow analysis.
  - Position stress contribution equals proposed portfolio weight times absolute Stress return.
  - Maximum stress-compatible weight equals position stress budget divided by absolute Stress return, capped by the existing maximum single-name weight.
  - Cash hurdle, minimum margin, transaction costs and all existing penalties remain unchanged from G4-2.1.
  - G4-2.2 cannot alter production Risk, Committee, Shadow Book or orders during the audit phase.
