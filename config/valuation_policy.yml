methodology_version: VAL-1.8
horizon_months: 12
freshness:
  price_target_max_age_days: 45
  recommendation_max_age_days: 45
  etf_holdings_max_age_days: 35
  fundamentals_max_period_age_days: 400
quality:
  minimum_equity_analyst_count: 3
  minimum_etf_covered_weight: 0.50
  minimum_etf_valid_holdings: 5
  maximum_etf_holdings_to_analyze: 50
  maximum_direct_constituent_lookups_per_etf: 25
  preferred_global_direct_constituent_lookups: 40
  # Was 60, sized for when Valuation only ran on the pre-selected Top-30 (at
  # most 6 ETF slots). Since the Fase 2 cutover, Valuation runs on the full
  # canonical universe (~36 ETFs), so a global budget of 60 starves whichever
  # ETFs are processed later in iteration order -- confirmed for IBB (only 4
  # of ~25 holdings got a direct lookup before the budget ran out, well under
  # minimum_etf_covered_weight). Raised to give each of ~36 ETFs a realistic
  # share; still a hard ceiling, not every ETF will use its full share
  # (many holdings are already covered by the equity universe's own cache).
  maximum_global_direct_constituent_lookups: 300
provider_fallbacks:
  finnhub_premium_etf_enabled: false
instrument_overrides:
  etf_like_tickers: [GLD, IBIT, ETHA]
  non_equity_trackers: [GLD, IBIT, ETHA]
probabilities:
  prior_bull: 0.25
  prior_base: 0.50
  prior_bear: 0.25
  max_recommendation_blend_weight: 0.50
confidence:
  base: 0.35
  fresh_price_target_bonus: 0.20
  analyst_count_bonus_max: 0.15
  fresh_recommendation_bonus: 0.10
  fundamentals_bonus: 0.10
  etf_holdings_coverage_bonus_max: 0.20
  etf_fresh_holdings_bonus: 0.10
status_policy:
  stale_material_input: BLOCKED_BY_DATA
  missing_material_input: BLOCKED_BY_DATA

# Broad diversified index ETFs may use a separately labelled aggregate-fundamentals
# model when constituent analyst-target look-through cannot economically reach 50%.
# Observed inputs are issuer facts; scenario growth/multiple assumptions are explicit,
# versioned valuation-policy assumptions and never presented as issuer forecasts.
index_etf_models:
  VEA:
    benchmark: FTSE Developed All Cap ex US Index
    current_pe: 16.6
    dividend_yield: 0.0239
    observed_earnings_growth: 0.1278
    base_earnings_growth: 0.075
    bull_growth: 0.11
    bear_growth: -0.04
    bull_terminal_pe: 17.5
    base_terminal_pe: 16.2
    bear_terminal_pe: 13.5
    confidence: 0.62
    source_date: '2026-07-31'
    source_ref: 'Vanguard Advisors VEA fundamentals: P/E 16.6x, dividend yield 2.39%, earnings growth 12.78%; benchmark FTSE Developed All Cap ex US Index'

notes:
  - VAL-1.8 adds an evidence-based aggregate-fundamentals engine for explicitly configured broad diversified index ETFs where 50% constituent analyst-target look-through is structurally uneconomic.
  - VEA observed inputs are Vanguard issuer fundamentals as of 2026-07-31; Bull/Base/Bear growth and terminal-multiple assumptions are explicit versioned policy assumptions, not issuer forecasts.
  - The 50% constituent look-through hurdle remains unchanged for the primary issuer-holdings method and for all ETFs not explicitly configured under index_etf_models.
  - Broad-universe equity valuation uses Finnhub price-target consensus only; recommendation trends and fundamentals are deferred to Deep Research after G4/ranking shortlist.
  - Equity ETF scenarios use official issuer holdings and canonical equity scenarios first.
  - ETF direct lookups are allocated by deterministic marginal-coverage efficiency and remain bounded by the global hard cap.
  - Finnhub Premium ETF endpoints remain disabled because production calls returned 403.
  - Secondary holdings sources remain explicitly tagged and receive lower confidence.
  - GLD, IBIT and ETHA continue to use the dedicated issuer-NAV stress model.
  - Historical momentum is not used to fabricate valuation targets.
