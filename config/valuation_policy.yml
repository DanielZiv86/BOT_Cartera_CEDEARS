methodology_version: VAL-1.6
horizon_months: 12
freshness:
  price_target_max_age_days: 45
  recommendation_max_age_days: 45
  etf_holdings_max_age_days: 35
  fundamentals_max_period_age_days: 400
quality:
  minimum_equity_analyst_count: 3
  minimum_etf_covered_weight: 0.50
  minimum_etf_valid_holdings: 5
  maximum_etf_holdings_to_analyze: 50
  maximum_direct_constituent_lookups_per_etf: 8
  maximum_global_direct_constituent_lookups: 40
provider_fallbacks:
  finnhub_premium_etf_enabled: false
instrument_overrides:
  etf_like_tickers:
    - GLD
    - IBIT
    - ETHA
  non_equity_trackers:
    - GLD
    - IBIT
    - ETHA
probabilities:
  prior_bull: 0.25
  prior_base: 0.50
  prior_bear: 0.25
  max_recommendation_blend_weight: 0.50
confidence:
  base: 0.35
  fresh_price_target_bonus: 0.20
  analyst_count_bonus_max: 0.15
  fresh_recommendation_bonus: 0.10
  fundamentals_bonus: 0.10
  etf_holdings_coverage_bonus_max: 0.20
  etf_fresh_holdings_bonus: 0.10
status_policy:
  stale_material_input: BLOCKED_BY_DATA
  missing_material_input: BLOCKED_BY_DATA
notes:
  - Broad-universe equity valuation uses Finnhub price-target consensus only; recommendation trends and fundamentals are deferred to Deep Research after G4/ranking shortlist.
  - Universe equity probabilities use the explicit policy prior so deferred enrichment cannot block or slow the 305-name coverage run.
  - Equity ETF scenarios use official issuer holdings and canonical equity scenarios first.
  - Direct constituent valuation is a bounded shared fallback: at most 8 uncached constituents per ETF and 40 across the full run; successes and failures remain cached across funds.
  - The bounded fallback prevents low-coverage foreign/broad ETFs from consuming hundreds of provider calls without a realistic path to the 50% look-through hurdle.
  - ETF look-through stops deterministically once minimum covered weight and minimum valid-holding count are both satisfied.
  - Finnhub Premium ETF endpoints are disabled for the current plan because real production calls returned 403; they can only be re-enabled explicitly by policy.
  - Issuer-specific holdings freshness may override the 35-day default only when the issuer publishes on a slower documented cadence; the applied threshold is emitted in each ETF row.
  - Secondary holdings sources are explicitly tagged and receive lower confidence; they never masquerade as issuer data.
  - GLD, IBIT and ETHA use a dedicated issuer-NAV + explicit asset stress-scenario model.
  - Non-equity stress assumptions are policy inputs, versioned separately and reviewed at least quarterly.
  - Historical momentum is not used to fabricate valuation targets.
