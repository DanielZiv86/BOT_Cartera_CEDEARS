methodology_version: SCENARIO-1.0
horizon_months: 12

# Fundamental equity scenarios are deliberately independent from analyst-low downside.
equity:
  base_growth_floor: -0.10
  base_growth_cap: 0.20
  base_pe_floor: 6.0
  base_pe_cap: 25.0
  consensus_base_blend: 0.20
  bear_eps_compression: 0.18
  bear_eps_compression_cap: 0.35
  bear_multiple_factor: 0.78
  bear_pe_floor: 5.0
  debt_equity_stress_start: 0.75
  debt_equity_stress_slope: 0.08
  max_leverage_extra_compression: 0.12
  bull_growth_floor: 0.08
  bull_growth_increment: 0.08
  bull_growth_cap: 0.30
  bull_multiple_factor: 1.12
  bull_pe_cap: 30.0

consensus:
  dispersion_review_threshold: 0.75
  high_distance_from_median_cap: 0.50

plausibility:
  max_standard_bull_upside: 0.60

probabilities:
  base_probability: 0.50
  bull_min: 0.15
  bull_max: 0.27
  dispersion_penalty_start: 0.50
  dispersion_bull_penalty_max: 0.07

policy_notes:
  - Analyst consensus is corroborating evidence, never the sole Bear/Base/Bull engine.
  - Bear is generated from stressed earnings and a compressed multiple; analyst low never defines it.
  - Base is primarily fundamental, with only a bounded 20% consensus-median blend.
  - Bull is capped by fundamental plausibility and winsorised consensus evidence before expected return.
  - Probabilities are dynamic and confidence/dispersion-aware rather than fixed 25/50/25.
  - Missing material fundamental evidence fails closed as SCENARIO_NOT_VALIDATED.
  - Expected return must be calculated only after this review.
