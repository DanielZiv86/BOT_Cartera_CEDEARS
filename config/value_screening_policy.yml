methodology_version: VALUE-SCREEN-1.0

# Fase 2 production policy. Feeds src/orchestration/build_value_research_screening.py
# (weekly_screening.yml): equities are selected for the Research Top-N by
# value_score (fundamentals), not by the technical screening_score, which is
# used only as a binary entry-timing gate. Cut over after the value-first
# shadow (src/orchestration/build_value_research_shadow.py, still available
# as an isolated audit tool) showed the prior technical-only selection
# structurally excluded every ticker that went on to pass G4.

components:
  consensus_upside_to_base:
    higher_is_better: true
    weight: 0.25
  fundamental_market_cap_usd:
    higher_is_better: true
    weight: 0.15
  sector_tech_affinity:
    higher_is_better: true
    weight: 0.10
  fundamental_pe_normalized:
    higher_is_better: false
    weight: 0.15
  fundamental_eps_growth_3y:
    higher_is_better: true
    weight: 0.15
  fundamental_roe:
    higher_is_better: true
    weight: 0.10
  fundamental_debt_to_equity:
    higher_is_better: false
    weight: 0.10

tech_sector_keywords:
  - TECHNOLOGY
  - SOFTWARE
  - SEMICONDUCTOR
  - INTERNET

max_uncertainty_penalty: 20.0
min_value_data_quality: 50.0

ranking:
  top_n: 30
  etf_slots: 6
  min_timing_gate_score: 45.0
  min_technical_data_quality: 60.0

notes:
  - Equities are ranked by value_score (fundamentals from the broad-universe Finnhub consensus scenario); the existing technical screening_score is used only as a binary entry-timing gate, never as the ranking key, for equities.
  - ETFs/non-equity keep the existing technical-only ranking track unchanged and do not compete against equities for value.
  - Missing fundamental data receives a neutral (50th percentile) contribution plus an explicit uncertainty penalty, the same policy already used by the technical screening engine, instead of being excluded or zero-filled.
  - A ticker with valuation_status=BLOCKED_BY_DATA (e.g. fewer than the minimum analyst count) will naturally have every fundamental component missing and therefore a low value_data_quality_score, without any special-cased handling.
  - fundamental_market_cap_usd and sector_tech_affinity implement a preference for larger, more established technology names (megacap/tech quality tilt), per the investor's stated profile -- both are score tilts (percentile-ranked / 0-1 flag), never hard filters, consistent with every other component here. sector_tech_affinity reads the canonical universe's industry_sector_official field (Comafi-sourced, always present at the universe level even when Finnhub fundamentals are missing), not a Finnhub-sourced field.
